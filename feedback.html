<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback Form - NISHANT TOOLS</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; background: #f1f3ff; font-family: Arial, sans-serif; }
  .container { max-width: 500px; margin: 20px auto; padding: 30px; background: #fff; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.09); }
  h2 { text-align: center; color: #252b48; margin-top: 0; }
  .subtitle { text-align: center; color: #777; font-size: 14px; margin-bottom: 25px; }
  label { display: block; margin: 17px 0 8px; font-weight: bold; font-size: 14px; }
  input, select, textarea { width: 100%; padding: 13px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; outline: none; font-family: inherit; }
  input:focus, select:focus, textarea:focus { border-color: #635bff; }
  textarea { min-height: 100px; resize: vertical; }
  button { width: 100%; padding: 15px; margin-top: 22px; border: none; border-radius: 8px; background: #635bff; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; }
  button:disabled { opacity: .6; cursor: not-allowed; }
  #message { text-align: center; margin-top: 15px; font-size: 14px; font-weight: bold; }
  .footer { text-align: center; color: #999; font-size: 12px; margin-top: 20px; }
</style>
</head>
<body>

<div class="container">
  <h2>💬 Feedback Form</h2>
  <p class="subtitle">We value your feedback! Help us improve our website.</p>

  <form id="feedbackForm">
    <label>Your Name *</label>
    <input name="name" type="text" placeholder="Enter your name" maxlength="100" required>

    <label>Email Address *</label>
    <input name="email" type="email" placeholder="Enter your email" maxlength="254" required>

    <label>How was your experience? *</label>
    <select name="rating" required>
      <option value="">Select your rating</option>
      <option value="Excellent">⭐⭐⭐⭐⭐ Excellent</option>
      <option value="Very Good">⭐⭐⭐⭐ Very Good</option>
      <option value="Good">⭐⭐⭐ Good</option>
      <option value="Average">⭐⭐ Average</option>
      <option value="Poor">⭐ Poor</option>
    </select>

    <label>What do you like about our website?</label>
    <textarea name="positive" placeholder="Tell us what you liked..." maxlength="3000"></textarea>

    <label>What can we improve? *</label>
    <textarea name="feedback" placeholder="Share your suggestions..." maxlength="3000" required></textarea>

    <label>Would you recommend our website?</label>
    <select name="recommend">
      <option value="">Select an option</option>
      <option value="Yes">Yes</option>
      <option value="Maybe">Maybe</option>
      <option value="No">No</option>
    </select>

    <button type="submit" id="submitBtn">Submit Feedback</button>
  </form>

  <div id="message" role="status" aria-live="polite"></div>
  <div class="footer">Thank you for your valuable feedback ❤️</div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxK3ebbPqO77sxJq-U9BOfLNVJUWROEYSXo8CM-9ZKTTVmpuAeHp-xB86keDNYg9zDh/exec";

  const form = document.getElementById("feedbackForm");
  const btn = document.getElementById("submitBtn");
  const message = document.getElementById("message");

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    if (!form.reportValidity()) return;

    btn.disabled = true;
    btn.innerText = "Submitting...";
    message.innerText = "";

    const body = new URLSearchParams(new FormData(form));

    try {
      await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: body });
      message.style.color = "green";
      message.innerText = "Thank you! Your feedback has been submitted successfully.";
      form.reset();
    } catch (err) {
      message.style.color = "red";
      message.innerText = "Submission failed. Please check your internet and try again.";
    }

    btn.disabled = false;
    btn.innerText = "Submit Feedback";
  });
</script>

</body>
</html>
