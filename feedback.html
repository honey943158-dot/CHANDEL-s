<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback - NISHANT TOOLS</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
  body { background: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: #fff; width: 100%; max-width: 480px; padding: 28px 24px; border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
  h1 { font-size: 22px; color: #0f172a; margin-bottom: 4px; }
  .sub { color: #64748b; font-size: 14px; margin-bottom: 20px; }
  label { display: block; font-size: 14px; font-weight: bold; color: #334155; margin: 14px 0 6px; }
  select, input[type="email"], textarea { width: 100%; padding: 11px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none; }
  select:focus, input:focus, textarea:focus { border-color: #2563eb; }
  textarea { min-height: 110px; resize: vertical; }
  .stars { display: flex; gap: 6px; }
  .stars span { font-size: 32px; color: #cbd5e1; cursor: pointer; user-select: none; transition: color .15s; }
  .stars span.on { color: #f59e0b; }
  button { width: 100%; margin-top: 20px; padding: 13px; background: #2563eb; color: #fff; border: 0; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
  button:disabled { background: #94a3b8; cursor: not-allowed; }
  #msg { margin-top: 14px; font-size: 14px; text-align: center; min-height: 20px; }
  .ok { color: #16a34a; } .err { color: #dc2626; }
  .hint { font-size: 12px; color: #94a3b8; margin-top: 4px; }
</style>
</head>
<body>
<div class="card">
  <h1>Your Feedback</h1>
  <p class="sub">Help us make NISHANT TOOLS better</p>

  <form id="fbForm">
    <label for="category">Category</label>
    <select id="category" required>
      <option value="">-- Select --</option>
      <option>Suggestion</option>
      <option>Bug / Problem</option>
      <option>New Tool Request</option>
      <option>Compliment</option>
      <option>Other</option>
    </select>

    <label>Rating</label>
    <div class="stars" id="stars">
      <span data-v="1">&#9733;</span><span data-v="2">&#9733;</span><span data-v="3">&#9733;</span><span data-v="4">&#9733;</span><span data-v="5">&#9733;</span>
    </div>

    <label for="feedback">Feedback</label>
    <textarea id="feedback" placeholder="Write your feedback here..." required></textarea>

    <label for="email">Email (optional)</label>
    <input type="email" id="email" placeholder="you@example.com">
    <p class="hint">If you enter your email, you will receive a thank-you message.</p>

    <button type="submit" id="btn">Submit Feedback</button>
    <div id="msg"></div>
  </form>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyviEymRjGIp8bWJrudze_3RxdzbU9S31HMbN4aiXQxJFIzi31tX86oDzd3hApt5us5/exec";

let rating = 0;
const stars = document.querySelectorAll("#stars span");

function paint(n) {
  stars.forEach(s => s.classList.toggle("on", Number(s.dataset.v) <= n));
}
stars.forEach(s => {
  s.addEventListener("click", () => { rating = Number(s.dataset.v); paint(rating); });
  s.addEventListener("mouseover", () => paint(Number(s.dataset.v)));
  s.addEventListener("mouseout", () => paint(rating));
});

document.getElementById("fbForm").addEventListener("submit", async function (e) {
  e.preventDefault();
  const msg = document.getElementById("msg");
  const btn = document.getElementById("btn");

  if (rating === 0) {
    msg.className = "err";
    msg.textContent = "Please select a rating (click on the stars).";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Sending...";
  msg.textContent = "";

  const data = new URLSearchParams({
    category: document.getElementById("category").value,
    rating: rating,
    feedback: document.getElementById("feedback").value.trim(),
    email: document.getElementById("email").value.trim()
  });

  try {
    await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: data });
    msg.className = "ok";
    msg.textContent = "Thank you! Your feedback has been received.";
    this.reset();
    rating = 0;
    paint(0);
  } catch (err) {
    msg.className = "err";
    msg.textContent = "Something went wrong. Please check your internet and try again.";
  }

  btn.disabled = false;
  btn.textContent = "Submit Feedback";
});
</script>
</body>
</html>
